<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOBBY</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina pagina--portada">
  <main class="portada">
    <section class="portada__bloque">
      <p class="logo">AURA<span class="logo__acento">FARMERS</span></p>
      <h1 class="portada__frase">¿Cómo te llamamos?</h1>

      <p class="aviso aviso--regalo">
        Por empezar recibes <strong><span data-dato="aura-regalo">1.000</span> de aura</strong>.
        Gástala con cabeza (o con gorra).
      </p>

      <form class="formulario" action="lobby.html" method="post">
        <div class="formulario__campo">
          <label class="formulario__etiqueta" for="apodo">Apodo</label>
          <input class="formulario__entrada" type="text" id="apodo" name="apodo"
                 placeholder="Ej.: SigmaDeLaMancha" maxlength="20" required>
          <p class="formulario__ayuda">Entre 3 y 20 caracteres. Que impresione.</p>
        </div>
        <button class="boton boton--principal" type="submit">Empezar a farmear</button>
      </form>
    </section>
  </main>
</body>
</html>
